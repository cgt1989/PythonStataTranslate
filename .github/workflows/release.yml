name: Release firmado

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-sign:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --onefile --windowed --noconfirm --name PythonStataTranslate app.py
      - name: Subir sin firmar
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: dist/PythonStataTranslate.exe
      - name: Firmar con SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: PythonStataTranslate
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" signed/PythonStataTranslate.exe --generate-notes
